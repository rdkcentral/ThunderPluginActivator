name: Linux build template

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      thunderextensions-ref:
        description: ThunderExtensions branch, tag, or commit SHA to check out
        required: false
        type: string
        default: main

jobs:
  ThunderPluginActivator:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        build_type: [Debug, Release, MinSizeRel]
        architecture: [32, 64]

    name: Build type - ${{ matrix.build_type }}${{ matrix.architecture == '32' && ' x86' || '' }}
    steps:
    - name: Install system dependencies
      uses: rdkcentral/ThunderTools/.github/actions/apt-dependencies@master
      with:
        architecture: ${{ matrix.architecture }}

    - name: Checkout PluginActivator
      uses: actions/checkout@v5
      with:
        path: PluginActivator
        repository: rdkcentral/ThunderPluginActivator

    - name: Checkout ThunderExtensions
      uses: actions/checkout@v5
      with:
        path: ThunderExtensions
        repository: rdkcentral/ThunderExtensions
        ref: ${{ inputs.thunderextensions-ref }}

    - name: Download Thunder artifact
      uses: actions/download-artifact@v4
      with:
        name: Thunder-${{ matrix.build_type }}${{ matrix.architecture == '32' && '_x86' || '' }}-artifact
        path: ${{ matrix.build_type }}

    - name: Unpack Thunder artifact
      run: |
        tar -xvzf ${{ matrix.build_type }}/${{ matrix.build_type }}${{ matrix.architecture == '32' && '_x86' || '' }}.tar.gz
        rm ${{ matrix.build_type }}/${{ matrix.build_type }}${{ matrix.architecture == '32' && '_x86' || '' }}.tar.gz

    - name: Stage ThunderExtensions headers
      run: |
        install -d "${PWD}/${{ matrix.build_type }}/install/usr/include/Thunder/extensions"
        cp ThunderExtensions/interfaces/*.h "${PWD}/${{ matrix.build_type }}/install/usr/include/Thunder/extensions/"

    - name: Build ThunderPluginActivator
      run: |
        cmake -G Ninja -S PluginActivator -B ${{ matrix.build_type }}/build/ThunderPluginActivator \
          -DCMAKE_CXX_FLAGS="-m${{ matrix.architecture }}" \
          -DCMAKE_C_FLAGS="-m${{ matrix.architecture }}" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_INSTALL_PREFIX="${PWD}/${{ matrix.build_type }}/install/usr" \
          -DCMAKE_MODULE_PATH="${PWD}/${{ matrix.build_type }}/install/usr/include/Thunder/Modules;${PWD}/${{ matrix.build_type }}/install/usr/include/WPEFramework/Modules" \
          -DCMAKE_PREFIX_PATH="${PWD}/${{ matrix.build_type }}/install/usr"
        cmake --build ${{ matrix.build_type }}/build/ThunderPluginActivator --target install

    - name: Tar files
      run: tar -czvf PluginActivator-${{ matrix.build_type }}${{ matrix.architecture == '32' && '_x86' || '' }}.tar.gz ${{ matrix.build_type }}

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: PluginActivator-${{ matrix.build_type }}${{ matrix.architecture == '32' && '_x86' || '' }}-artifact
        path: PluginActivator-${{ matrix.build_type }}${{ matrix.architecture == '32' && '_x86' || '' }}.tar.gz